  ];
  var dataParts = [
    buildUrl + "/fef8fdd7cfc9e5a5001034b01fa3647b.data.part0",
    buildUrl + "/fef8fdd7cfc9e5a5001034b01fa3647b.data.part1"
  ];

  // Show the loading screen immediately (it used to appear only after the download finished)
  loadingBar.style.display = "flex";

  // Byte-level progress across every part of every file
  var downloadedBytes = 0;
  var allParts = wasmParts.concat(dataParts);
  var partReceived = allParts.map(function () { return 0; });
  var partTotal = allParts.map(function () { return 0; });
  var partDone = allParts.map(function () { return false; });

  function updateDownloadProgress() {
    var sum = 0;
    for (var i = 0; i < allParts.length; i++) {
      if (partDone[i]) sum += 1;
      else if (partTotal[i] > 0) sum += Math.min(partReceived[i] / partTotal[i], 0.99);
    }
    progressBarFull.style.width = (60 * sum / allParts.length) + "%";
    labelEl.textContent = "Downloading " + (downloadedBytes / 1048576).toFixed(1) + " MB";
  }

  async function fetchPart(url, idx) {
    var res = await fetch(url, { cache: "force-cache" });
    if (!res.ok) throw new Error("Failed to load game asset (" + res.status + "): " + url);
    partTotal[idx] = parseInt(res.headers.get("content-length"), 10) || 0;
    if (!res.body || !res.body.getReader) {
      var blob = await res.blob();
      downloadedBytes += blob.size; partDone[idx] = true; updateDownloadProgress();
      return blob;
    }
    var reader = res.body.getReader(), chunks = [];
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      chunks.push(r.value);
      partReceived[idx] += r.value.length;
      downloadedBytes += r.value.length;
      updateDownloadProgress();
    }
    partDone[idx] = true; updateDownloadProgress();
    return new Blob(chunks);
  }

  // All parts download in parallel (was one-at-a-time per file)
  async function mergeFiles(parts, offset, mimeType) {
    var blobs = await Promise.all(parts.map(function (p, i) { return fetchPart(p, offset + i); }));
    return URL.createObjectURL(new Blob(blobs, { type: mimeType }));
  }

  // Load the Unity loader script in parallel with the downloads
  function loadLoader() {
    return new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = resolve;
      script.onerror = function () { reject(new Error("Failed to load Unity loader")); };
      document.body.appendChild(script);
    });
  }

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    container.className = "unity-mobile";
    canvas.className = "unity-mobile";
  }

  window.myGameInstance = null;

  Promise.all([
    mergeFiles(wasmParts, 0, "application/wasm"),
    mergeFiles(dataParts, wasmParts.length, "application/octet-stream"),
    loadLoader()
  ]).then(function (results) {
    var config = {
      dataUrl: results[1],
      frameworkUrl: buildUrl + "/e12dac5a3f5e3f677b009118afef20b7.framework.js",
      codeUrl: results[0],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Games Place",
      productName: "Granny 3",
      productVersion: "0.1",
      showBanner: unityShowBanner
    };
    labelEl.textContent = "Starting game";
    return createUnityInstance(canvas, config, function (progress) {
      progressBarFull.style.width = (60 + 40 * progress) + "%";
    });
  }).then(function (unityInstance) {
    window.myGameInstance = unityInstance;
    progressBarFull.style.width = "100%";
    loadingBar.style.display = "none";
    canvas.focus();
  }).catch(function (err) {
    console.error("Game load error:", err);
    labelEl.textContent = "Load failed — refresh to retry";
  });
</script>
</body>
</html>

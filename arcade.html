<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090810" />
    <title>Google Classroom</title>
    <link rel="icon" href="https://xcarcade.vercel.app/media/google-classroom.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #090810; color: #f5f3ff; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { text-align: center; padding: 24px; }
      a { color: #b9a8ff; }
    </style>
    <script>
      (() => {
        const siteUrl = "https://xcarcade.vercel.app/";
        const blobDocument = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Classroom</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#090810}iframe{display:block}#fallback{position:fixed;z-index:2;left:12px;bottom:12px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:14px system-ui,sans-serif}#fallback a{color:#c4b4ff}</style></head><body><iframe title="Xander’s Arcade" src="${siteUrl}" allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad" allowfullscreen></iframe><div id="fallback">If the arcade does not load, <a href="${siteUrl}">open Xander’s Arcade</a>.</div><script>const frame=document.querySelector('iframe');frame.addEventListener('load',()=>document.getElementById('fallback').remove(),{once:true});<\/script></body></html>`;
        const blobUrl = URL.createObjectURL(new Blob([blobDocument], { type: "text/html" }));
        window.location.replace(blobUrl);
      })();
    </script>
  </head>
  <body>
    <main><p>Opening Xander’s Arcade…</p><p><a href="https://xcarcade.vercel.app/">Open the live site</a></p></main>
  </body>
</html>
